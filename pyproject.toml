[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "figma-to-react"
version = "1.0.0"
description = "Figma design to React app conversion harness built on the GitHub Copilot SDK"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "github-copilot-sdk>=1.0",
    "numpy>=1.26",
    "pillow>=10",
    "playwright>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
figma-to-react = "figma_to_react.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "scripts"]
